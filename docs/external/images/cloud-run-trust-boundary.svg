<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" aria-describedby="description" aria-labelledby="title" role="img" viewBox="0 0 900 720"><style>@media (prefers-color-scheme:dark){[fill=&quot;#FAF7EE&quot;]{fill:#4a3221}[stroke=&quot;#D9CFB6&quot;]{stroke:#6c7440}rect[fill=&quot;#FFFFFF&quot;]{fill:#5d4230}[fill=&quot;#593e2e&quot;]{fill:#6c7440}[stroke=&quot;#593e2e&quot;]{stroke:#a9b06b}[fill=&quot;#565A35&quot;]{fill:#a9b06b}[fill=&quot;#4F5430&quot;]{fill:#dce0b8}[stroke=&quot;#6E7544&quot;]{stroke:#b9bf7e}[fill=&quot;#E7DFC6&quot;]{fill:#3e4425}[stroke=&quot;#DDD3BC&quot;]{stroke:#6c7440}[fill=&quot;#EEE7D3&quot;]{fill:#4f3a28}[stroke=&quot;#A89F84&quot;]{stroke:#b7a98f}[fill=&quot;#3B2A1E&quot;]{fill:#f2e6d8}[fill=&quot;#6E5D4C&quot;]{fill:#d9c6b2}[fill=&quot;#F7F3E6&quot;]{fill:#fff}}</style><title id="title">PRFlow cloud run trust boundary</title><desc id="description">A GitHub comment passes through an authorization gate that uses narrow GitHub permissions. The gate starts a maintainer-controlled agent job with model credentials and configured repository permissions. The agent job produces a branch, workpad, pull request or review. A person reviews and merges the work.</desc><defs><marker id="arrow" markerHeight="12" markerUnits="strokeWidth" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#565A35" d="M 0 0 L 12 6 L 0 12 z"/></marker></defs><rect width="898" height="718" x="1" y="1" fill="#FAF7EE" stroke="#D9CFB6" stroke-width="2" rx="28"/><g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="46" y="52" fill="#3B2A1E" font-size="26" font-weight="600">How a cloud command becomes review-ready work</text><text x="46" y="83" fill="#6E5D4C" font-size="16">The authorization gate runs before the agent job.</text><text x="46" y="107" fill="#6E5D4C" font-size="16">Repository rules still govern what each job can access.</text><rect width="392" height="446" x="462" y="134" fill="#EEE7D3" stroke="#6E7544" stroke-dasharray="8 7" stroke-width="2" rx="24"/><rect width="256" height="34" x="487" y="118" fill="#593e2e" rx="17"/><text x="615" y="141" fill="#F7F3E6" font-size="13" font-weight="600" letter-spacing=".5" text-anchor="middle">TRUSTED EXECUTION BOUNDARY</text><line x1="408" x2="500" y1="250" y2="250" stroke="#593e2e" stroke-width="3" marker-end="url(#arrow)"/><line x1="680" x2="680" y1="326" y2="404" stroke="#593e2e" stroke-width="3" marker-end="url(#arrow)"/><line x1="502" x2="410" y1="480" y2="480" stroke="#593e2e" stroke-width="3" marker-end="url(#arrow)"/><g><rect width="360" height="150" x="48" y="176" fill="#FFF" stroke="#DDD3BC" stroke-width="2" rx="18"/><circle cx="88" cy="218" r="20" fill="#E7DFC6"/><text x="88" y="225" fill="#4F5430" font-size="19" font-weight="700" text-anchor="middle">1</text><text x="122" y="224" fill="#3B2A1E" font-size="20" font-weight="600">GitHub comment</text><text x="76" y="270" fill="#6E5D4C" font-size="17">A collaborator requests implementation</text><text x="76" y="296" fill="#6E5D4C" font-size="17">or review.</text></g><g><rect width="324" height="150" x="500" y="176" fill="#FFF" stroke="#593e2e" stroke-width="2" rx="18"/><circle cx="540" cy="218" r="20" fill="#E7DFC6"/><text x="540" y="225" fill="#4F5430" font-size="19" font-weight="700" text-anchor="middle">2</text><text x="574" y="224" fill="#3B2A1E" font-size="20" font-weight="600">Authorization gate</text><text x="528" y="270" fill="#6E5D4C" font-size="17">Checks the allowed list and</text><text x="528" y="296" fill="#6E5D4C" font-size="17">uses narrow GitHub permissions.</text></g><g><rect width="324" height="150" x="500" y="404" fill="#FFF" stroke="#593e2e" stroke-width="2" rx="18"/><circle cx="540" cy="446" r="20" fill="#E7DFC6"/><text x="540" y="453" fill="#4F5430" font-size="19" font-weight="700" text-anchor="middle">3</text><text x="574" y="452" fill="#3B2A1E" font-size="20" font-weight="600">Agent job</text><text x="528" y="498" fill="#6E5D4C" font-size="17">Receives model credentials and</text><text x="528" y="524" fill="#6E5D4C" font-size="17">configured repository permissions.</text></g><g><rect width="360" height="150" x="48" y="404" fill="#FFF" stroke="#DDD3BC" stroke-width="2" rx="18"/><circle cx="88" cy="446" r="20" fill="#E7DFC6"/><text x="88" y="453" fill="#4F5430" font-size="19" font-weight="700" text-anchor="middle">4</text><text x="122" y="452" fill="#3B2A1E" font-size="20" font-weight="600">Work product</text><text x="76" y="498" fill="#6E5D4C" font-size="17">Branch, workpad, pull request</text><text x="76" y="524" fill="#6E5D4C" font-size="17">or review.</text></g><line x1="228" x2="228" y1="554" y2="615" stroke="#A89F84" stroke-width="2"/><circle cx="228" cy="615" r="5" fill="#593e2e"/><text x="228" y="652" fill="#3B2A1E" font-size="18" font-weight="600" text-anchor="middle">Human review and merge</text><text x="228" y="678" fill="#6E5D4C" font-size="16" text-anchor="middle">Automation stops before merge.</text></g></svg>