<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" aria-describedby="description" aria-labelledby="title" role="img" viewBox="0 0 900 720"><style>@media (prefers-color-scheme:dark){[fill=&quot;#FAF7EE&quot;]{fill:#4a3221}[stroke=&quot;#D9CFB6&quot;]{stroke:#6c7440}rect[fill=&quot;#FFFFFF&quot;]{fill:#5d4230}[fill=&quot;#593e2e&quot;]{fill:#6c7440}[stroke=&quot;#593e2e&quot;]{stroke:#a9b06b}[fill=&quot;#565A35&quot;]{fill:#a9b06b}[fill=&quot;#4F5430&quot;]{fill:#dce0b8}[fill=&quot;#E7DFC6&quot;]{fill:#3e4425}[stroke=&quot;#DDD3BC&quot;]{stroke:#6c7440}[fill=&quot;#EEE7D3&quot;]{fill:#4f3a28}[fill=&quot;#3B2A1E&quot;]{fill:#f2e6d8}[fill=&quot;#6E5D4C&quot;]{fill:#d9c6b2}[fill=&quot;#E8F5EF&quot;]{fill:#2e4034}[fill=&quot;#2F6B51&quot;]{fill:#9fd4bc}[stroke=&quot;#70A38B&quot;]{stroke:#9fd4bc}[fill=&quot;#F7F3E6&quot;]{fill:#fff}}</style><title id="title">PRFlow review engine and correction loop</title><desc id="description">The prflow review skill runs four phases: setup and classification, verification checklist, specialized reviewers and verdict. The prflow review-and-fix skill uses the same review engine, applies justified corrections, verifies them and runs the engine again. A shadow pass checks an approval-side result before the loop exits.</desc><defs><marker id="arrow" markerHeight="12" markerUnits="strokeWidth" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#565A35" d="M 0 0 L 12 6 L 0 12 z"/></marker></defs><rect width="898" height="718" x="1" y="1" fill="#FAF7EE" stroke="#D9CFB6" stroke-width="2" rx="28"/><g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="46" y="52" fill="#3B2A1E" font-size="26" font-weight="600">How PRFlow reviews and corrects a change</text><text x="46" y="83" fill="#6E5D4C" font-size="16">The correction loop reuses the same four-phase review engine.</text><rect width="142" height="32" x="46" y="112" fill="#593e2e" rx="16"/><text x="117" y="134" fill="#F7F3E6" font-size="14" font-weight="700" text-anchor="middle">prflow:review</text><line x1="408" x2="492" y1="224" y2="224" stroke="#593e2e" stroke-width="3" marker-end="url(#arrow)"/><line x1="676" x2="676" y1="296" y2="368" stroke="#593e2e" stroke-width="3" marker-end="url(#arrow)"/><line x1="492" x2="408" y1="440" y2="440" stroke="#593e2e" stroke-width="3" marker-end="url(#arrow)"/><g><rect width="360" height="138" x="48" y="158" fill="#FFF" stroke="#DDD3BC" stroke-width="2" rx="18"/><circle cx="88" cy="199" r="20" fill="#E7DFC6"/><text x="88" y="206" fill="#4F5430" font-size="19" font-weight="700" text-anchor="middle">1</text><text x="122" y="205" fill="#3B2A1E" font-size="20" font-weight="600">Setup and classification</text><text x="76" y="250" fill="#6E5D4C" font-size="16">Resolve the diff, base, issue criteria</text><text x="76" y="275" fill="#6E5D4C" font-size="16">and risk profile.</text></g><g><rect width="360" height="138" x="492" y="158" fill="#FFF" stroke="#DDD3BC" stroke-width="2" rx="18"/><circle cx="532" cy="199" r="20" fill="#E7DFC6"/><text x="532" y="206" fill="#4F5430" font-size="19" font-weight="700" text-anchor="middle">2</text><text x="566" y="205" fill="#3B2A1E" font-size="20" font-weight="600">Verification checklist</text><text x="520" y="250" fill="#6E5D4C" font-size="16">Check change-specific claims against</text><text x="520" y="275" fill="#6E5D4C" font-size="16">mechanical or reviewer evidence.</text></g><g><rect width="360" height="138" x="492" y="368" fill="#FFF" stroke="#DDD3BC" stroke-width="2" rx="18"/><circle cx="532" cy="409" r="20" fill="#E7DFC6"/><text x="532" y="416" fill="#4F5430" font-size="19" font-weight="700" text-anchor="middle">3</text><text x="566" y="415" fill="#3B2A1E" font-size="20" font-weight="600">Specialized reviewers</text><text x="520" y="460" fill="#6E5D4C" font-size="16">Review correctness, tests, comments,</text><text x="520" y="485" fill="#6E5D4C" font-size="16">silent failures and type design.</text></g><g><rect width="360" height="138" x="48" y="368" fill="#FFF" stroke="#70A38B" stroke-width="2" rx="18"/><circle cx="88" cy="409" r="20" fill="#E8F5EF"/><text x="88" y="416" fill="#2F6B51" font-size="19" font-weight="700" text-anchor="middle">4</text><text x="122" y="415" fill="#3B2A1E" font-size="20" font-weight="600">Verdict</text><text x="76" y="460" fill="#6E5D4C" font-size="16">Combine evidence, findings, coverage</text><text x="76" y="485" fill="#6E5D4C" font-size="16">and configured severity thresholds.</text></g><line x1="228" x2="228" y1="506" y2="558" stroke="#593e2e" stroke-width="3" marker-end="url(#arrow)"/><rect width="804" height="116" x="48" y="558" fill="#EEE7D3" stroke="#593e2e" stroke-width="2" rx="20"/><rect width="214" height="32" x="72" y="578" fill="#593e2e" rx="16"/><text x="179" y="600" fill="#F7F3E6" font-size="14" font-weight="700" text-anchor="middle">prflow:review-and-fix</text><text x="72" y="638" fill="#3B2A1E" font-size="18" font-weight="600">Apply justified corrections → verify them → run the review engine again</text><text x="72" y="664" fill="#6E5D4C" font-size="15">A shadow pass checks an approval-side result before the loop exits.</text><text x="817" y="644" fill="#4F5430" font-size="28" font-weight="700" text-anchor="middle">↺</text></g></svg>