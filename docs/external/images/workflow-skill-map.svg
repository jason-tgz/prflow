<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" aria-describedby="description" aria-labelledby="title" role="img" viewBox="0 0 900 760"><style>@media (prefers-color-scheme:dark){[fill=&quot;#FAF7EE&quot;]{fill:#4a3221}[stroke=&quot;#D9CFB6&quot;]{stroke:#6c7440}rect[fill=&quot;#FFFFFF&quot;]{fill:#5d4230}[fill=&quot;#593e2e&quot;]{fill:#6c7440}[stroke=&quot;#593e2e&quot;]{stroke:#a9b06b}[fill=&quot;#4F5430&quot;]{fill:#dce0b8}[fill=&quot;#E7DFC6&quot;]{fill:#3e4425}[stroke=&quot;#DDD3BC&quot;]{stroke:#6c7440}[fill=&quot;#3B2A1E&quot;]{fill:#f2e6d8}[fill=&quot;#6E5D4C&quot;]{fill:#d9c6b2}[fill=&quot;#E8F5EF&quot;]{fill:#2e4034}[fill=&quot;#2F6B51&quot;]{fill:#9fd4bc}[stroke=&quot;#70A38B&quot;]{stroke:#9fd4bc}[fill=&quot;#F7F3E6&quot;]{fill:#fff}}</style><title id="title">Choose a PRFlow skill by outcome</title><desc id="description">Four core delivery skills create an issue, implement an issue, review changes or review and fix changes. Three supporting skills update a pull request description, maintain documentation or run the weekly retrospective.</desc><rect width="898" height="758" x="1" y="1" fill="#FAF7EE" stroke="#D9CFB6" stroke-width="2" rx="28"/><g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="46" y="52" fill="#3B2A1E" font-size="26" font-weight="600">Choose the skill that matches the outcome</text><text x="46" y="83" fill="#6E5D4C" font-size="16">Start with the smallest workflow that has the edit authority you need.</text><text x="48" y="130" fill="#6E5D4C" font-size="14" font-weight="700" letter-spacing=".7">CORE DELIVERY SKILLS</text><g><rect width="385" height="142" x="48" y="150" fill="#FFF" stroke="#DDD3BC" stroke-width="2" rx="18"/><rect width="190" height="31" x="72" y="174" fill="#E7DFC6" rx="15"/><text x="167" y="195" fill="#4F5430" font-size="15" font-weight="700" text-anchor="middle">prflow:spec</text><text x="72" y="239" fill="#3B2A1E" font-size="20" font-weight="600">Create an approved issue</text><text x="72" y="268" fill="#6E5D4C" font-size="16">Turns a rough request into a reviewed ticket.</text></g><g><rect width="385" height="142" x="467" y="150" fill="#FFF" stroke="#593e2e" stroke-width="2" rx="18"/><rect width="166" height="31" x="491" y="174" fill="#593e2e" rx="15"/><text x="574" y="195" fill="#F7F3E6" font-size="15" font-weight="700" text-anchor="middle">prflow:implement</text><text x="491" y="239" fill="#3B2A1E" font-size="20" font-weight="600">Complete an existing issue</text><text x="491" y="268" fill="#6E5D4C" font-size="16">Prepares a review-ready or draft pull request.</text></g><g><rect width="385" height="142" x="48" y="322" fill="#FFF" stroke="#70A38B" stroke-width="2" rx="18"/><rect width="144" height="31" x="72" y="346" fill="#E8F5EF" rx="15"/><text x="144" y="367" fill="#2F6B51" font-size="15" font-weight="700" text-anchor="middle">prflow:review</text><text x="72" y="411" fill="#3B2A1E" font-size="20" font-weight="600">Assess without tree edits</text><text x="72" y="440" fill="#6E5D4C" font-size="16">Returns findings and an APPROVE or REJECT verdict.</text></g><g><rect width="385" height="142" x="467" y="322" fill="#FFF" stroke="#593e2e" stroke-width="2" rx="18"/><rect width="214" height="31" x="491" y="346" fill="#E7DFC6" rx="15"/><text x="598" y="367" fill="#4F5430" font-size="15" font-weight="700" text-anchor="middle">prflow:review-and-fix</text><text x="491" y="411" fill="#3B2A1E" font-size="20" font-weight="600">Assess and correct</text><text x="491" y="440" fill="#6E5D4C" font-size="16">Commits corrections only when you authorize edits.</text></g><text x="48" y="516" fill="#6E5D4C" font-size="14" font-weight="700" letter-spacing=".7">SUPPORTING SKILLS</text><g><rect width="250" height="154" x="48" y="536" fill="#FFF" stroke="#DDD3BC" stroke-width="2" rx="18"/><text x="72" y="572" fill="#4F5430" font-size="15" font-weight="700">prflow:pr-description</text><text x="72" y="610" fill="#3B2A1E" font-size="18" font-weight="600">Explain the change</text><text x="72" y="640" fill="#6E5D4C" font-size="15">Refreshes the pull request</text><text x="72" y="663" fill="#6E5D4C" font-size="15">description.</text></g><g><rect width="250" height="154" x="325" y="536" fill="#FFF" stroke="#DDD3BC" stroke-width="2" rx="18"/><text x="349" y="572" fill="#4F5430" font-size="15" font-weight="700">prflow:docs</text><text x="349" y="610" fill="#3B2A1E" font-size="18" font-weight="600">Document the change</text><text x="349" y="640" fill="#6E5D4C" font-size="15">Runs the complete branch</text><text x="349" y="663" fill="#6E5D4C" font-size="15">documentation pass.</text></g><g><rect width="250" height="154" x="602" y="536" fill="#FFF" stroke="#DDD3BC" stroke-width="2" rx="18"/><text x="626" y="572" fill="#4F5430" font-size="15" font-weight="700">prflow:retrospective-weekly</text><text x="626" y="610" fill="#3B2A1E" font-size="18" font-weight="600">Learn from merged work</text><text x="626" y="640" fill="#6E5D4C" font-size="15">Produces bounded proposals</text><text x="626" y="663" fill="#6E5D4C" font-size="15">for human triage.</text></g><text x="450" y="726" fill="#6E5D4C" font-size="15" text-anchor="middle">Skill names stay the same; invocation syntax varies by client.</text></g></svg>