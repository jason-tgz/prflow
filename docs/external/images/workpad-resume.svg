<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" aria-describedby="description" aria-labelledby="title" role="img" viewBox="0 0 900 700"><style>@media (prefers-color-scheme:dark){[fill=&quot;#FAF7EE&quot;]{fill:#4a3221}[stroke=&quot;#D9CFB6&quot;]{stroke:#6c7440}rect[fill=&quot;#FFFFFF&quot;]{fill:#5d4230}[fill=&quot;#593e2e&quot;]{fill:#6c7440}[stroke=&quot;#593e2e&quot;]{stroke:#a9b06b}[fill=&quot;#565A35&quot;]{fill:#a9b06b}[fill=&quot;#4F5430&quot;]{fill:#dce0b8}[fill=&quot;#E7DFC6&quot;]{fill:#3e4425}[fill=&quot;#3B2A1E&quot;]{fill:#f2e6d8}[fill=&quot;#6E5D4C&quot;]{fill:#d9c6b2}[fill=&quot;#FFF8EC&quot;]{fill:#4c3a20}[fill=&quot;#7A4D00&quot;]{fill:#f0c980}[fill=&quot;#F0F8F4&quot;]{fill:#2e4034}[fill=&quot;#2F6B51&quot;]{fill:#9fd4bc}[stroke=&quot;#70A38B&quot;]{stroke:#9fd4bc}[stroke=&quot;#D49A3A&quot;]{stroke:#f0c980}[fill=&quot;#F7F3E6&quot;]{fill:#fff}}</style><title id="title">How PRFlow resumes implementation work</title><desc id="description">PRFlow reads recovery evidence from the GitHub issue workpad and the remote branch. The prflow implement skill uses both sources. A Blocked workpad causes PRFlow to surface the recorded cause. If matching open work exists, PRFlow adopts it, inspects the current tree and repeats checks that can block the run.</desc><defs><marker id="arrow" markerHeight="12" markerUnits="strokeWidth" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#565A35" d="M 0 0 L 12 6 L 0 12 z"/></marker></defs><rect width="898" height="698" x="1" y="1" fill="#FAF7EE" stroke="#D9CFB6" stroke-width="2" rx="28"/><g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="46" y="52" fill="#3B2A1E" font-size="26" font-weight="600">Resume uses two kinds of recovery evidence</text><text x="46" y="83" fill="#6E5D4C" font-size="16">The progress record and pushed code answer different questions.</text><g><rect width="360" height="194" x="48" y="132" fill="#FFF" stroke="#593e2e" stroke-width="2" rx="18"/><rect width="192" height="32" x="72" y="156" fill="#E7DFC6" rx="16"/><text x="168" y="178" fill="#4F5430" font-size="15" font-weight="700" text-anchor="middle">GitHub issue workpad</text><text x="72" y="226" fill="#3B2A1E" font-size="19" font-weight="600">Human-readable progress</text><text x="72" y="259" fill="#6E5D4C" font-size="16">Status and feature branch</text><text x="72" y="284" fill="#6E5D4C" font-size="16">Plan and acceptance criteria</text><text x="72" y="309" fill="#6E5D4C" font-size="16">Blockers, deferrals and reflections</text></g><g><rect width="360" height="194" x="492" y="132" fill="#FFF" stroke="#593e2e" stroke-width="2" rx="18"/><rect width="150" height="32" x="516" y="156" fill="#E7DFC6" rx="16"/><text x="591" y="178" fill="#4F5430" font-size="15" font-weight="700" text-anchor="middle">Remote branch</text><text x="516" y="226" fill="#3B2A1E" font-size="19" font-weight="600">Durable code checkpoints</text><text x="516" y="259" fill="#6E5D4C" font-size="16">Scoped commits</text><text x="516" y="284" fill="#6E5D4C" font-size="16">Verified pushes</text><text x="516" y="309" fill="#6E5D4C" font-size="16">Matching pull request head</text></g><line x1="228" x2="355" y1="326" y2="400" stroke="#593e2e" stroke-width="3" marker-end="url(#arrow)"/><line x1="672" x2="545" y1="326" y2="400" stroke="#593e2e" stroke-width="3" marker-end="url(#arrow)"/><rect width="380" height="104" x="260" y="396" fill="#593e2e" rx="20"/><text x="450" y="436" fill="#F7F3E6" font-size="16" font-weight="700" text-anchor="middle">prflow:implement</text><text x="450" y="470" fill="#F7F3E6" font-size="20" font-weight="600" text-anchor="middle">Read both before planning</text><line x1="365" x2="235" y1="500" y2="552" stroke="#593e2e" stroke-width="3" marker-end="url(#arrow)"/><line x1="535" x2="665" y1="500" y2="552" stroke="#593e2e" stroke-width="3" marker-end="url(#arrow)"/><g><rect width="360" height="108" x="48" y="550" fill="#FFF8EC" stroke="#D49A3A" stroke-width="2" rx="18"/><text x="72" y="588" fill="#7A4D00" font-size="19" font-weight="600">If the Workpad is Blocked</text><text x="72" y="620" fill="#6E5D4C" font-size="16">Surface the recorded cause and wait</text><text x="72" y="644" fill="#6E5D4C" font-size="16">for the required human action.</text></g><g><rect width="360" height="108" x="492" y="550" fill="#F0F8F4" stroke="#70A38B" stroke-width="2" rx="18"/><text x="516" y="588" fill="#2F6B51" font-size="19" font-weight="600">If matching open work exists</text><text x="516" y="620" fill="#6E5D4C" font-size="16">Adopt the branch or pull request, inspect</text><text x="516" y="644" fill="#6E5D4C" font-size="16">the tree and repeat blocking checks.</text></g></g></svg>